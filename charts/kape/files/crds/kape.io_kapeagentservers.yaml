---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: kapeagentservers.kape.io
spec:
  group: kape.io
  names:
    categories:
    - kape
    kind: KapeAgentServer
    listKind: KapeAgentServerList
    plural: kapeagentservers
    shortNames:
    - kas
    singular: kapeagentserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.controller.image
      name: Image
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KapeAgentServer is the declarative serving-environment CR (ADR-0087): one CR
          materialises one kape-controller Deployment (env-configured tool surface) plus
          the network resources in the CR's namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              KapeAgentServerSpec declares one project serving environment (ADR-0087): the
              controller image, sandbox defaults, model gateway, credential registry,
              network surface, and free-text self-description.
            properties:
              controller:
                description: Controller is the kape-controller this CR materialises.
                properties:
                  image:
                    description: Image is the kape-controller OCI image reference.
                    minLength: 1
                    type: string
                  resources:
                    description: Resources overrides the controller container's requests/limits.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This is an alpha field and requires enabling the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                required:
                - image
                type: object
              credentials:
                description: Credentials is the generic credential registry (ADR-0088).
                items:
                  description: |-
                    AgentServerCredentialSpec is one entry of the generic credential registry
                    (ADR-0088): a named credential, the Secret that holds it, the OpenShell
                    provider type it is imported as, and the egress hosts it is bound to.
                  properties:
                    hostPatterns:
                      description: |-
                        HostPatterns are the egress hosts the credential is bound to, in
                        OpenShell NetworkEndpoint syntax (host[:port] globs).
                      items:
                        maxLength: 253
                        type: string
                      maxItems: 16
                      minItems: 1
                      type: array
                    name:
                      description: |-
                        Name identifies the credential within this KapeAgentServer. It is part of
                        the OpenShell provider name the operator derives, so it is a DNS label.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    providerType:
                      description: |-
                        ProviderType is the OpenShell provider type the credential is imported as
                        (e.g. "git-https"). The registry is generic (D2) — new types are config.
                      minLength: 1
                      type: string
                    secretRef:
                      description: SecretRef names the same-namespace Secret holding
                        the credential value.
                      properties:
                        name:
                          description: Name is the Secret name in the KapeAgentServer's
                            own namespace.
                          minLength: 1
                          type: string
                        namespace:
                          description: |-
                            Namespace is rejected at admission whenever set. It exists only so a
                            cross-namespace reference fails with a targeted message instead of
                            surfacing as an unknown field; credential Secrets are same-namespace.
                          type: string
                      required:
                      - name
                      type: object
                  required:
                  - hostPatterns
                  - name
                  - providerType
                  - secretRef
                  type: object
                  x-kubernetes-validations:
                  - message: hostPatterns entries must be host[:port] globs in OpenShell
                      NetworkEndpoint syntax (e.g. github.com:443, *.example.com:443,
                      **.example.com:443)
                    rule: self.hostPatterns.all(h, h.matches('^([*]{1,2}|[A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?)([.]([*]{1,2}|[A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?))*(:[0-9]{1,5})?$'))
                  - message: 'secretRef must be same-namespace: omit namespace (credential
                      Secrets are read from the KapeAgentServer namespace only)'
                    rule: '!has(self.secretRef.namespace)'
                maxItems: 32
                type: array
              description:
                description: |-
                  Description is the serving environment's self-description, served to MCP
                  clients as the server `instructions` of the initialize handshake
                  (KAPE_SERVER_DESCRIPTION). This is how callers route between several
                  KapeAgentServers exposing the same tool contract (D6).
                maxLength: 8192
                type: string
              modelGateway:
                description: ModelGateway points at the inference gateway.
                properties:
                  url:
                    description: |-
                      URL is the model-gateway base URL patched into each sandbox's models.json
                      (KAPE_MODEL_GATEWAY_URL).
                    minLength: 1
                    pattern: ^https?://.+
                    type: string
                required:
                - url
                type: object
              network:
                description: Network declares the serving environment's network surface.
                properties:
                  egressPolicyRefs:
                    description: |-
                      EgressPolicyRefs names same-namespace NetworkPolicy resources that define
                      the controller pod's additional egress. Declared now so the schema needs no
                      revision; the controller egress path is reconciled by the credential
                      slices (#264/#265), which render per-endpoint egress from credentials[].
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 32
                    type: array
                  ingress:
                    description: Ingress publishes the controller's MCP + REST endpoint
                      under Host.
                    properties:
                      host:
                        description: Host is the DNS name the controller is served
                          under.
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      tlsSecretName:
                        description: |-
                          TLSSecretName is the same-namespace Secret holding the serving
                          certificate (kubernetes.io/tls). Empty serves plain HTTP.
                        type: string
                    required:
                    - host
                    type: object
                type: object
              sandbox:
                description: Sandbox holds the defaults every sandbox created here
                  inherits.
                properties:
                  image:
                    description: Image is the default sandbox agent image (KAPE_DEFAULT_IMAGE).
                    minLength: 1
                    type: string
                  model:
                    description: |-
                      Model is the default model id handed to the sandbox agent
                      (KAPE_DEFAULT_MODEL). Empty keeps the sandbox image's own selection, so
                      the pattern admits the empty string alongside model ids.
                    pattern: ^([A-Za-z0-9._:/-]+)?$
                    type: string
                  resources:
                    description: |-
                      Resources is the default sandbox cpu/memory profile
                      (KAPE_DEFAULT_RESOURCES).
                    properties:
                      cpu:
                        description: CPU is a Kubernetes CPU quantity (e.g. "1", "500m").
                        pattern: ^[0-9]+([.][0-9]+)?m?$
                        type: string
                      memory:
                        description: Memory is a Kubernetes memory quantity (e.g.
                          "2Gi", "512Mi").
                        pattern: ^[0-9]+([.][0-9]+)?(E|P|T|G|M|K|Ei|Pi|Ti|Gi|Mi|Ki)?$
                        type: string
                    required:
                    - cpu
                    - memory
                    type: object
                required:
                - image
                - resources
                type: object
            required:
            - controller
            - modelGateway
            - sandbox
            type: object
            x-kubernetes-validations:
            - message: credentials[].name must be unique within a KapeAgentServer
              rule: '!has(self.credentials) || self.credentials.all(c1, self.credentials.exists_one(c2,
                c2.name == c1.name))'
          status:
            description: KapeAgentServerStatus defines the observed state of a KapeAgentServer.
            properties:
              conditions:
                description: |-
                  Conditions carry the aggregate Ready condition, plus Degraded once the
                  credential slices land (D9).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              credentials:
                description: 'Credentials reports per-credential provisioning state
                  (written by #265).'
                items:
                  description: |-
                    AgentServerCredentialStatus reports one credential's provisioning outcome.
                    Nothing writes it until the credential-automation slice (#265); the schema
                    ships now so that slice needs no CRD revision.
                  properties:
                    conditions:
                      description: Conditions report the credential's provisioning
                        state (e.g. Pushed).
                      items:
                        description: Condition contains details for one aspect of
                          the current state of this API Resource.
                        properties:
                          lastTransitionTime:
                            description: |-
                              lastTransitionTime is the last time the condition transitioned from one status to another.
                              This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                            format: date-time
                            type: string
                          message:
                            description: |-
                              message is a human readable message indicating details about the transition.
                              This may be an empty string.
                            maxLength: 32768
                            type: string
                          observedGeneration:
                            description: |-
                              observedGeneration represents the .metadata.generation that the condition was set based upon.
                              For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                              with respect to the current state of the instance.
                            format: int64
                            minimum: 0
                            type: integer
                          reason:
                            description: |-
                              reason contains a programmatic identifier indicating the reason for the condition's last transition.
                              Producers of specific condition types may define expected values and meanings for this field,
                              and whether the values are considered a guaranteed API.
                              The value should be a CamelCase string.
                              This field may not be empty.
                            maxLength: 1024
                            minLength: 1
                            pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                            type: string
                          status:
                            description: status of the condition, one of True, False,
                              Unknown.
                            enum:
                            - "True"
                            - "False"
                            - Unknown
                            type: string
                          type:
                            description: type of condition in CamelCase or in foo.example.com/CamelCase.
                            maxLength: 316
                            pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                            type: string
                        required:
                        - lastTransitionTime
                        - message
                        - reason
                        - status
                        - type
                        type: object
                      type: array
                    name:
                      description: Name is the credentials[].name this status describes.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the metadata.generation last reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
