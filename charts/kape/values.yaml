# kape-controller (openshell controller, ADR-0083/0084) deploy wiring.
# Core runtime env names/defaults match controller/config.go envConfig and
# controller/README.md — override the gateway/creds values for your setup.
controller:
  image:
    repository: ghcr.io/dzungtr/kape-controller
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  serviceAccountName: kape-controller
  # Core runtime env (KAPE_* names in controller/config.go).
  # gatewayAddr: in-cluster OpenShell gateway Service — override to match
  # your gateway (the compiled default 127.0.0.1:32353 only works in-process).
  gatewayAddr: openshell-gateway.openshell.svc.cluster.local:32353
  # credsDir: mount path for the controller's mTLS gateway credentials.
  # Set creds.secretRef to a Secret whose keys are the credential files
  # (ca.pem / client-cert / client-key) — it is volume-mounted read-only at
  # credsDir. Empty secretRef → directory will not exist; provide creds
  # out-of-band or the controller cannot authenticate to the gateway.
  credsDir: /var/run/kape-controller/creds
  creds:
    secretRef: ""
  # NOTE: there is no sandboxNamespace knob. The controller resolves Sandbox
  # CRs in the compiled-default `openshell` namespace
  # (controller/config.go:242). For a non-default sandbox namespace, inject
  # KAPE_SANDBOX_NAMESPACE into the controller pod out-of-band (the chart
  # does not wire it); the ClusterRole in controller/rbac.yaml is
  # cluster-scoped, so no RBAC change is needed.
  # defaultImage: sandbox agent image handed to the gateway.
  defaultImage: ghcr.io/dzungtr/pi-openshell:openrouter
  # modelGatewayUrl: in-cluster model gateway (config.go compiled default).
  modelGatewayUrl: http://model-gateway-http.aperture.svc.cluster.local/v1
  transport: pull
  # eventStore: written under the mounted emptyDir (/var/lib/kape-controller),
  # not the container filesystem.
  eventStore: /var/lib/kape-controller/controller-events.db
  # networkPolicy: OPTIONAL default-deny egress policy for controller pods.
  # Default OFF: when enabled, it permits ONLY DNS/53, the SLM monitor
  # destination derived from monitor.baseUrl, and the Kubernetes API —
  # ASSUMPTION: API server pods live in kube-system and accept 443
  # (kubeadm/k3s/GKE shape; override the rule if your control plane
  # differs). It does NOT open the OpenShell gateway, model-gateway, or
  # other core paths — extend the template before enabling in a
  # policy-enforcing cluster.
  networkPolicy:
    enabled: false
  # SLM monitor (spec #230, issue #234). Env names map 1:1 to
  # controller/config.go envConfig (KAPE_MONITOR_*). Empty
  # openrouterApiKey.secretRef → no API key env → monitor disabled.
  monitor:
    intervalSeconds: 60
    summarizerModel: scaledown/summarize
    classifierModel: scaledown/classify-1
    baseUrl: https://openrouter.ai/api/v1
    timeoutSeconds: 5
    openrouterApiKey:
      secretRef: ""
      key: OPENROUTER_API_KEY

operator:
  image:
    repository: ghcr.io/kape-io/kape-operator
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  leaderElect: true

taskService:
  image:
    repository: ghcr.io/kape-io/kape-task-service
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  database:
    secretName: kape-task-service-db

runtime:
  image:
    repository: ghcr.io/kape-io/kape-runtime
    tag: "0.1.0"
    pullPolicy: IfNotPresent

dashboard:
  image:
    repository: ghcr.io/kape-io/kape-dashboard
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  traceUrlTemplate: ""
  ingress:
    enabled: false
    host: ""

adapters:
  falco:
    enabled: true
    image:
      repository: ghcr.io/kape-io/kape-adapter-falco
      tag: "0.1.0"
  alertmanager:
    enabled: false
    image:
      repository: ghcr.io/kape-io/kape-adapter-alertmanager
      tag: "0.1.0"
  audit:
    enabled: false
    image:
      repository: ghcr.io/kape-io/kape-adapter-audit
      tag: "0.1.0"

# kapeproxy sidecar image used by operator-managed handler pods.
# The release pin lives here (per D17), not in operator Go code or in
# playground/Tilt dev tooling (which use :local per D18).
kapeproxy:
  image:
    repository: kape/kapeproxy
    tag: "0.7.0"
    pullPolicy: IfNotPresent

nats:
  replicaCount: 3
  storage: 10Gi
  image:
    repository: nats
    tag: "2.10-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    retain: false
  stream:
    # duplicateWindow is the JetStream publisher-deduplication window for
    # KAPE_EVENTS. Must match what adapters rely on for idempotent delivery.
    duplicateWindow: 60s

postgres:
  instances: 2
  storage: 10Gi
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "16.3"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

certManager:
  enabled: true
  issuerEmail: ""
  clusterIssuer:
    staging: true
    production: false

# nack controls rendering of the NACK Stream CR for cluster deployments.
# When enabled=false (default) the Helm job provisions the stream instead.
nack:
  enabled: false

namespace: kape-system
clusterName: ""

oauth2Proxy:
  enabled: false
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: "v7.6.0"
    pullPolicy: IfNotPresent
  provider: google
  emailDomain: "*"
  secretName: kape-oauth2-proxy
  ingress:
    host: ""

# crds controls the pre-install hook that applies the kape.io CRDs and the
# KapeHandler validating webhook configuration via a ConfigMap-backed Job.
crds:
  install: true
