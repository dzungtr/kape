# KapeAgentServer (ADR-0087, issue #263): the one declarative path. The
# operator renders the kape-controller Deployment, its ServiceAccount +
# RoleBinding, the Service and (optionally) the Ingress from this CR. The chart
# no longer templates a controller Deployment — reconfigure the controller by
# editing the CR, not the chart.
agentServer:
  name: default
  # description is served to MCP clients as the server `instructions` of the
  # initialize handshake (D6). When several KapeAgentServers share a cluster,
  # callers route between them by CR name + description.
  description: "kape default agent server: sandbox agents for this cluster"
  controller:
    image:
      repository: ghcr.io/dzungtr/kape-controller
      tag: "0.1.0"
    # resources: optional requests/limits for the controller container.
    resources: {}
  sandbox:
    # Default sandbox agent image (KAPE_DEFAULT_IMAGE) every create_agent
    # inherits unless the caller overrides it.
    image: ghcr.io/dzungtr/pi-openshell:openrouter
    # model: default sandbox model id (KAPE_DEFAULT_MODEL). Empty keeps the
    # sandbox image's own model selection.
    model: ""
    # Default sandbox cpu/memory (KAPE_DEFAULT_RESOURCES).
    resources:
      cpu: "1"
      memory: "2Gi"
  modelGateway:
    # In-cluster model gateway base URL (KAPE_MODEL_GATEWAY_URL).
    url: http://model-gateway-http.aperture.svc.cluster.local/v1
  # credentials: generic credential registry (ADR-0088) —
  # [{"name": "github", "secretRef": {"name": "github-token"},
  #   "providerType": "git-https", "hostPatterns": ["github.com:443"]}].
  # The schema ships now; the operator reconciles it in #265.
  credentials: []
  network:
    ingress:
      # Publish the controller's MCP + REST endpoint outside the cluster.
      enabled: false
      host: ""
      # Same-namespace TLS Secret (kubernetes.io/tls). Empty serves plain HTTP.
      tlsSecretName: ""
    # Same-namespace NetworkPolicy names defining the controller pod's extra
    # egress (schema only until the credential slices, #264/#265).
    egressPolicyRefs: []

# controllerWiring is cluster plumbing, NOT KapeAgentServer intent (D5: env is
# the operator→controller contract). The operator copies these into every
# controller Deployment it renders; an unset value is reported on the CR's
# Ready condition (reason WiringIncomplete) instead of being defaulted.
controllerWiring:
  # In-cluster OpenShell gateway Service. Override to match your gateway.
  gatewayAddr: openshell.openshell.svc.cluster.local:8080
  # Mount path for the controller's mTLS gateway credentials.
  credsDir: /var/run/kape-controller/creds
  # Secret whose keys are the credential files (ca.pem / client-cert /
  # client-key), mounted read-only at credsDir.
  credsSecret: kape-controller-creds
  # Provider attached to every sandbox this controller creates.
  defaultProvider: openrouter
  # Data plane: pull (default) or exec (break-glass).
  transport: pull
  # Durable event log path; its directory is backed by an emptyDir in the
  # rendered controller pod.
  eventStore: /var/lib/kape-controller/controller-events.db
  # extraEnv / extraEnvFrom are copied verbatim into the rendered controller
  # container (after the CR contract env, which always wins on a name clash).
  # The chart fills them from the optional feature values below.
  extraEnv: []
  extraEnvFrom: []

# Optional controller feature wiring. The chart translates these into
# controllerWiring.extraEnv/extraEnvFrom — the operator knows no feature names.
# SLM monitor (spec #230, issue #234). Env names map 1:1 to
# controller/config.go envConfig (KAPE_MONITOR_*). Empty
# openrouterApiKey.secretRef → no API key env → monitor disabled.
controller:
  monitor:
    intervalSeconds: 60
    summarizerModel: scaledown/summarize
    classifierModel: scaledown/classify-1
    baseUrl: https://openrouter.ai/api/v1
    timeoutSeconds: 5
    openrouterApiKey:
      secretRef: ""
      key: OPENROUTER_API_KEY
  # Tier-2 revive (issue #251, spec #245 E5). max = revives per session
  # lifetime; cooldownSeconds = minimum spacing between attempts.
  revive:
    max: 3
    cooldownSeconds: 60

operator:
  image:
    repository: ghcr.io/kape-io/kape-operator
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  leaderElect: true

taskService:
  image:
    repository: ghcr.io/kape-io/kape-task-service
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  database:
    secretName: kape-task-service-db

runtime:
  image:
    repository: ghcr.io/kape-io/kape-runtime
    tag: "0.1.0"
    pullPolicy: IfNotPresent

dashboard:
  image:
    repository: ghcr.io/kape-io/kape-dashboard
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  traceUrlTemplate: ""
  ingress:
    enabled: false
    host: ""

adapters:
  falco:
    enabled: true
    image:
      repository: ghcr.io/kape-io/kape-adapter-falco
      tag: "0.1.0"
  alertmanager:
    enabled: false
    image:
      repository: ghcr.io/kape-io/kape-adapter-alertmanager
      tag: "0.1.0"
  audit:
    enabled: false
    image:
      repository: ghcr.io/kape-io/kape-adapter-audit
      tag: "0.1.0"

# kapeproxy sidecar image used by operator-managed handler pods.
# The release pin lives here (per D17), not in operator Go code or in
# playground/Tilt dev tooling (which use :local per D18).
kapeproxy:
  image:
    repository: kape/kapeproxy
    tag: "0.7.0"
    pullPolicy: IfNotPresent

nats:
  replicaCount: 3
  storage: 10Gi
  image:
    repository: nats
    tag: "2.10-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    retain: false
  stream:
    # duplicateWindow is the JetStream publisher-deduplication window for
    # KAPE_EVENTS. Must match what adapters rely on for idempotent delivery.
    duplicateWindow: 60s

postgres:
  instances: 2
  storage: 10Gi
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "16.3"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

certManager:
  enabled: true
  issuerEmail: ""
  clusterIssuer:
    staging: true
    production: false

# nack controls rendering of the NACK Stream CR for cluster deployments.
# When enabled=false (default) the Helm job provisions the stream instead.
nack:
  enabled: false

namespace: kape-system
clusterName: ""

oauth2Proxy:
  enabled: false
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: "v7.6.0"
    pullPolicy: IfNotPresent
  provider: google
  emailDomain: "*"
  secretName: kape-oauth2-proxy
  ingress:
    host: ""

# crds controls the pre-install hook that applies the kape.io CRDs and the
# KapeHandler validating webhook configuration via a ConfigMap-backed Job.
crds:
  install: true
