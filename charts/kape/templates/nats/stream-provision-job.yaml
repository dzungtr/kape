{{- if not .Values.nack.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: kape-nats-stream-provision
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: nats-cli
          image: natsio/nats-box:0.14.5
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for NATS to be ready..."
              until nats server check --server nats://nats.{{ .Values.namespace }}.svc:4222 2>/dev/null; do
                sleep 2
              done
              echo "Provisioning KAPE_EVENTS stream..."
              nats stream add KAPE_EVENTS \
                --subjects "kape.events.>" \
                --retention limits \
                --max-age 24h \
                --storage file \
                --replicas {{ .Values.nats.replicaCount }} \
                --discard old \
                --dupe-window {{ .Values.nats.stream.duplicateWindow }} \
                --server nats://nats.{{ .Values.namespace }}.svc:4222 \
                2>/dev/null || \
              nats stream edit KAPE_EVENTS \
                --subjects "kape.events.>" \
                --retention limits \
                --max-age 24h \
                --storage file \
                --replicas {{ .Values.nats.replicaCount }} \
                --discard old \
                --dupe-window {{ .Values.nats.stream.duplicateWindow }} \
                --server nats://nats.{{ .Values.namespace }}.svc:4222 \
                --force
              echo "Stream KAPE_EVENTS provisioned."
{{- end }}
