apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kape-operator
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, serviceaccounts, namespaces]
    verbs: [get, list, watch, create, update, patch, delete]
  # Credential transit (ADR-0088, issue #265): the operator reads credential
  # Secrets and never writes them — get/list/watch only, label-gated in code
  # (kape.io/credential=true) and same-namespace by construction.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings, roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kape.io]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
