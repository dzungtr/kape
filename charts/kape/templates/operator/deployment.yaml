apiVersion: apps/v1
kind: Deployment
metadata:
  name: kape-operator
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      app: kape-operator
  template:
    metadata:
      labels:
        app: kape-operator
    spec:
      serviceAccountName: kape-operator
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.operator.leaderElect }}
          env:
            {{- /* Cluster wiring copied into every rendered controller Deployment
                 (D5). Unset values surface on KapeAgentServer Ready instead of
                 being defaulted. */}}
            - name: KAPE_OPERATOR_CONTROLLER_GATEWAY_ADDR
              value: {{ .Values.controllerWiring.gatewayAddr | quote }}
            - name: KAPE_OPERATOR_CONTROLLER_CREDS_DIR
              value: {{ .Values.controllerWiring.credsDir | quote }}
            - name: KAPE_OPERATOR_CONTROLLER_CREDS_SECRET
              value: {{ .Values.controllerWiring.credsSecret | quote }}
            - name: KAPE_OPERATOR_CONTROLLER_DEFAULT_PROVIDER
              value: {{ .Values.controllerWiring.defaultProvider | quote }}
            - name: KAPE_OPERATOR_CONTROLLER_TRANSPORT
              value: {{ .Values.controllerWiring.transport | quote }}
            - name: KAPE_OPERATOR_CONTROLLER_EVENT_STORE
              value: {{ .Values.controllerWiring.eventStore | quote }}
            {{- /* Optional feature wiring, chart-owned: monitor + revive values and
                 the generic passthrough lists are all JSON env for the operator. */}}
            {{- $extraEnv := list
                  (dict "name" "KAPE_MONITOR_INTERVAL_SECONDS" "value" (.Values.controller.monitor.intervalSeconds | toString))
                  (dict "name" "KAPE_MONITOR_SUMMARIZER_MODEL" "value" .Values.controller.monitor.summarizerModel)
                  (dict "name" "KAPE_MONITOR_CLASSIFIER_MODEL" "value" .Values.controller.monitor.classifierModel)
                  (dict "name" "KAPE_MONITOR_BASE_URL" "value" .Values.controller.monitor.baseUrl)
                  (dict "name" "KAPE_MONITOR_TIMEOUT_SECONDS" "value" (.Values.controller.monitor.timeoutSeconds | toString))
                  (dict "name" "KAPE_REVIVE_MAX" "value" (.Values.controller.revive.max | toString))
                  (dict "name" "KAPE_REVIVE_COOLDOWN" "value" (.Values.controller.revive.cooldownSeconds | toString)) }}
            {{- if .Values.controller.monitor.openrouterApiKey.secretRef }}
            {{- $extraEnv = append $extraEnv (dict "name" "KAPE_MONITOR_OPENROUTER_API_KEY"
                  "valueFrom" (dict "secretKeyRef" (dict "name" .Values.controller.monitor.openrouterApiKey.secretRef
                                                          "key" .Values.controller.monitor.openrouterApiKey.key))) }}
            {{- end }}
            {{- $extraEnv = concat $extraEnv (.Values.controllerWiring.extraEnv | default list) }}
            - name: KAPE_OPERATOR_CONTROLLER_EXTRA_ENV
              value: {{ $extraEnv | toJson | quote }}
            - name: KAPE_OPERATOR_CONTROLLER_EXTRA_ENV_FROM
              value: {{ .Values.controllerWiring.extraEnvFrom | default list | toJson | quote }}
            - name: NATS_URL
              value: "nats://nats.{{ .Values.namespace }}.svc:4222"
            - name: KAPEPROXY_IMAGE
              value: "{{ .Values.kapeproxy.image.repository }}:{{ .Values.kapeproxy.image.tag }}"
            - name: RUNTIME_IMAGE
              value: "{{ .Values.runtime.image.repository }}:{{ .Values.runtime.image.tag }}"
            {{- /* OpenShell credential writer (ADR-0088, issue #265): the operator's
                 own gateway connection, used to push credentials[] Secrets into
                 provider records. Disabled unless a creds Secret is configured —
                 the CR then reports every credential as
                 Pushed=False/GatewayNotConfigured instead of staying silently
                 unprovisioned. */}}
            {{- if .Values.operator.openshell.credsSecret }}
            - name: KAPE_OPERATOR_OPENSHELL_GATEWAY_ADDR
              value: {{ .Values.operator.openshell.gatewayAddr | default .Values.controllerWiring.gatewayAddr | quote }}
            - name: KAPE_OPERATOR_OPENSHELL_CREDS_DIR
              value: {{ .Values.operator.openshell.credsDir | quote }}
            - name: KAPE_OPERATOR_OPENSHELL_WORKSPACE
              value: {{ .Values.operator.openshell.workspace | quote }}
            {{- end }}
          {{- if .Values.operator.openshell.credsSecret }}
          volumeMounts:
            - name: openshell-mtls
              mountPath: {{ .Values.operator.openshell.credsDir }}
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 30
      {{- if .Values.operator.openshell.credsSecret }}
      volumes:
        - name: openshell-mtls
          secret:
            secretName: {{ .Values.operator.openshell.credsSecret }}
      {{- end }}
