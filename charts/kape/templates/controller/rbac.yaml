{{- /* kape-controller RBAC (ADR-0087 clean cut, issue #263).

     The controller Deployment is rendered by the operator from a
     KapeAgentServer CR — the chart no longer templates it (and no longer
     templates its ServiceAccount, Service, or NetworkPolicy).

     What stays cluster-scoped and chart-owned is the one grant a namespaced CR
     must not hand itself: read access to agent-sandbox Sandbox CRs
     (agents.x-k8s.io, ADR-0083 D7). The operator binds this ClusterRole to each
     CR-rendered controller ServiceAccount with a namespaced RoleBinding, so the
     cluster-wide grant is reviewed here while the per-CR ServiceAccount lives
     in the CR's own namespace.

     The name is a contract with the operator: infra/k8s.SandboxReaderClusterRole. */ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kape-controller-sandbox-reader
  labels:
    app: kape-controller
rules:
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "watch"]
