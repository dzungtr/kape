{{- /* kape-controller ServiceAccount (issue #234 fix round 1): the
     Deployment references .Values.controller.serviceAccountName; without a
     templated SA the pod would never schedule. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.controller.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: kape-controller
