version: v2
# Vendored protos (proto/) are copied verbatim from NVIDIA/OpenShell tag v0.1.0
# and carry no go_package option upstream. The Go package mapping is supplied
# here instead of patching the vendored files (issue #262 / M9 invariant).
plugins:
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative
      - Mopenshell.proto=github.com/dzungtr/kape/controller/gen;v1
      - Mdatamodel.proto=github.com/dzungtr/kape/controller/gen;v1
      - Msandbox.proto=github.com/dzungtr/kape/controller/gen;v1
      - Moptions.proto=github.com/dzungtr/kape/controller/gen;v1
  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
      - Mopenshell.proto=github.com/dzungtr/kape/controller/gen;v1
      - Mdatamodel.proto=github.com/dzungtr/kape/controller/gen;v1
      - Msandbox.proto=github.com/dzungtr/kape/controller/gen;v1
      - Moptions.proto=github.com/dzungtr/kape/controller/gen;v1
