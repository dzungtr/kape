# NATS 2.10 JetStream server with mTLS enforcement — reference k8s manifest
---
apiVersion: v1
kind: Namespace
metadata:
  name: kape-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: kape-system
data:
  nats.conf: |
    server_name: nats-0
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222

    jetstream {
      store_dir: /data
      max_memory_store: 256Mi
      max_file_store: 10Gi
    }

    tls {
      ca_file:         /etc/nats/certs/ca.crt
      cert_file:       /etc/nats/certs/tls.crt
      key_file:        /etc/nats/certs/tls.key
      verify:          true
      verify_and_map:  true
    }

    authorization {
      users: [
        {
          user: kape-adapter
          permissions: {
            publish:   { allow: ["kape.events.>"] }
            subscribe: { deny: [">"] }
          }
        },
        {
          user: kape-handler
          permissions: {
            publish:   { allow: ["kape.events.>"] }
            subscribe: { allow: ["kape.events.>"] }
          }
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: kape-system
spec:
  type: ClusterIP
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
---
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  namespace: kape-system
spec:
  clusterIP: None
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: kape-system
spec:
  serviceName: nats-headless
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-c", "/etc/nats/config/nats.conf"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: nats-config
              mountPath: /etc/nats/config
              readOnly: true
            - name: nats-server-tls
              mountPath: /etc/nats/certs
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: nats-config
          configMap:
            name: nats-config
        - name: nats-server-tls
          secret:
            secretName: kape-nats-server-cert
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
