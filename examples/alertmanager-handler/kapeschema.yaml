apiVersion: kape.io/v1alpha1
kind: KapeSchema
metadata:
  name: alert-decision
  namespace: kape-system
spec:
  version: v1
  jsonSchema:
    type: object
    additionalProperties: false
    required:
      - severity
      - action
      - summary
    properties:
      severity:
        type: string
        enum:
          - low
          - medium
          - high
          - critical
        description: "Assessed severity of the alert"
      action:
        type: string
        enum:
          - investigate
          - escalate
          - resolve
          - ignore
        description: "Recommended action in response to the alert"
      summary:
        type: string
        description: "Brief description of the alert and recommended next step"
